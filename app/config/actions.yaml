# Action Definitions Configuration
# Add, remove, or modify actions here without changing code.

actions:
  schedule_meeting:
    description: "Schedule a meeting with participants"
    keywords:
      - schedule
      - meeting
      - appointment
      - book meeting
    required_parameters:
      - attendee
      - date
      - time
    example_inputs:
      - "Schedule a meeting with John tomorrow at 2 PM"
      - "Book an appointment with the team next Monday at 10 AM"
      - "Set up a meeting with Sarah for Friday afternoon"

  create_reminder:
    description: "Create a reminder for a task or event"
    keywords:
      - remind
      - reminder
      - remember
      - don't forget
      - alert me
    required_parameters:
      - task
      - time
    example_inputs:
      - "Remind me to call the dentist tomorrow"
      - "Set a reminder for the meeting in 30 minutes"
      - "Remember to buy groceries after work"

  create_task:
    description: "Create a new task or todo item"
    keywords:
      - task
      - todo
      - create task
      - add task
      - new task
    required_parameters:
      - task_name
    example_inputs:
      - "Create a task to fix the bug"
      - "Add a task for code review"
      - "New task: prepare presentation slides"

  update_calendar:
    description: "Update calendar with an event or block time"
    keywords:
      - calendar
      - block time
      - update calendar
      - add to calendar
      - calendar event
    required_parameters:
      - event_name
      - date
      - time
    example_inputs:
      - "Block 2 hours on my calendar for the presentation"
      - "Update calendar with lunch plans on Friday"
      - "Add focus time to my calendar tomorrow morning"
